# Monitor virtual no DP-0 (sem hardware) para usar com Sunshine/Moonlight.
# ConnectedMonitor substitui a deteccao automatica, entao os monitores reais
# (HDMI-0 e DP-4) precisam estar listados aqui tambem.
# Para desfazer: sudo rm /etc/X11/xorg.conf.d/20-virtual-monitor.conf e reiniciar.
Section "Device"
    Identifier  "nvidia-virtual"
    Driver      "nvidia"
    BusID       "PCI:3:0:0"
    Option      "ConnectedMonitor" "HDMI-0, DP-4, DP-0"
    Option      "CustomEDID" "DP-0:/etc/X11/edid-virtual.bin"
EndSection
